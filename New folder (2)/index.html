<script>
    let clients = JSON.parse(localStorage.getItem('garuda_clients')) || [];
    let generatedOTP = null;
    const BACKEND_URL = 'https://your-backend-api.com'; // Replace with your server URL

    async function sendOTP(mode) {
        const phone = (mode === 'login') ? document.getElementById('lPhone').value : document.getElementById('rPhone').value;
        
        if(!phone || !phone.startsWith('+')) {
            return alert("Enter phone with country code (e.g., +1 for USA, +91 for India)");
        }

        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

        // 1. Show loading state
        const btn = (mode === 'login') ? document.getElementById('auth-btn') : document.getElementById('reg-btn');
        btn.innerText = "Sending SMS...";
        btn.disabled = true;

        try {
            // 2. Call your Real SMS Backend
            const response = await fetch(`${BACKEND_URL}/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, otp: generatedOTP })
            });

            const result = await response.json();

            if (result.success) {
                alert("SMS Sent to your phone!");
                // 3. Show OTP boxes
                if(mode === 'login') {
                    document.getElementById('otp-box').classList.remove('hidden');
                    btn.innerText = "Authorize & Enter";
                    btn.onclick = login;
                } else {
                    document.getElementById('otp-box-reg').classList.remove('hidden');
                    btn.innerText = "Complete Registration";
                    btn.onclick = register;
                }
            } else {
                throw new Error(result.error);
            }
        } catch (err) {
            alert("SMS Failed: " + err.message);
            btn.innerText = "Retry";
        } finally {
            btn.disabled = false;
        }
    }

    // ... Keep your existing register(), login(), and render() functions from the previous index code ...
</script>
